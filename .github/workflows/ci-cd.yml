# fluxdev-blog CI/CD: lint, tipos y pruebas en paralelo; deploy solo desde main
name: fluxdev-blog CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref, excepto deploys en main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Node + Bun + caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Biome CI
        run: bunx biome ci .

  types:
    name: Tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Type check
        run: bun run typecheck

  test:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Run tests
        run: bun run test

  deploy:
    name: Deploy a Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, types, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Build
        run: bun run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      # Usa el wrangler lockeado en el proyecto, no el de la action
      - name: Deploy a Cloudflare Pages
        run: bunx wrangler pages deploy dist/ --project-name=fluxdev-blog --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
